<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
  <div class="css-1a2b3c4">
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" data-testid="login-email-input" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" data-testid="login-password-input" placeholder="Password" />

      <div class="checkbox-row">
        <input type="checkbox" id="remember_20481" name="remember" />
        <label for="remember_20481">Remember me</label>
      </div>

      <button type="submit" data-testid="login-submit-btn" class="sc-bZQltP">Log In</button>
      <a href="/forgot-password" aria-label="Forgot your password?">Forgot password?</a>
    </form>
  </div>
</body>
</html>
